# Properties file for Spring Boot configuration.

# Port on which the embedded Tomcat web server listens.
server.port=8080

# Thymeleaf template settings: templates live in classpath:/templates/ and use .html.
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# Disable template caching so edits are visible while developing.
spring.thymeleaf.cache=false
